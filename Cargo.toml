[package]
name = "StarBrowser"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "Starbrowser"
path = "src/main.rs"

[dependencies]
env_logger = "0.11.10"
glyphon = "0.11.0"
lru = "0.18.0"
pollster = "0.4.0"
rustls = "0.23.41"
rustls-native-certs = "0.7"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.14.1"
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = "0.26.4"
tracy-client = "0.18.4"
trust-dns-resolver = "0.23.2"
wgpu = "29.0.3"
winit = "0.30.13"


[features]
transparent = []